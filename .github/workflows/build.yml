name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -dynamiclib -o s2cheat.dylib s2cheat.mm -framework Foundation -framework UIKit -install_name @rpath/s2cheat.dylib -isysroot "$SDK" -std=c++17 -O2
      - name: sign
        run: brew install ldid && ldid -S s2cheat.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: s2cheat
          path: s2cheat.dylib

